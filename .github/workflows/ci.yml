name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly: new advisories and toolchain drift show up without a code change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (rustfmt, clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for the desktop app
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev pkg-config build-essential
      - uses: actions-rust-lang/setup-rust-toolchain@v1 # reads rust-toolchain.toml
        with:
          rustflags: ""
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for the desktop app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev pkg-config build-essential
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Test everything, including the desktop app (Linux)
        if: runner.os == 'Linux'
        run: cargo test --workspace --release
      - name: Test the daemon, CLI and protocol crates (macOS, Windows)
        if: runner.os != 'Linux'
        run: cargo test --release -p usbip-proto -p periwire -p periwire-client
      - name: The desktop app still compiles (macOS, Windows)
        if: runner.os != 'Linux'
        run: cargo build --release -p periwire-gui

  ui:
    name: UI stability
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a browser for the UI check
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: The UI must not rebuild idle pages
        run: python tools/ui-churn.py --check

  audit:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # fails on known vulnerabilities; the "unmaintained" warnings from the Linux desktop app's GTK stack are documented in docs/SECURITY.md
      - run: cargo audit
