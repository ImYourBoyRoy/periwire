[package]
name = "periwire"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
usbip-proto = { path = "../usbip-proto" }
periwire-client = { path = "../periwire-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gethostname = "0.5"
rusb = { version = "0.9", features = ["vendored"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal", "process", "fs", "io-std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
dirs = "5"
clap_complete = "4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["relax-sign-encoding"] }
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-io-usb-host = "0.3"
