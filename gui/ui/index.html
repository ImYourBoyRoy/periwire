<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121110">
  <title>PeriWire</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <script>try{var c=localStorage.getItem("periwire.theme")||"auto";var m=matchMedia("(prefers-color-scheme: light)").matches;document.documentElement.dataset.theme=c==="auto"?(m?"linen":"clay"):c}catch(e){}</script>
</head>
<body>
  <div class="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
  <div class="app">
    <aside class="side">
      <div class="brand"><img src="logo.png" alt=""><div><b>PeriWire</b><small>USB over network</small></div></div>
      <nav class="nav" id="nav"><i class="nav-pill" id="pill"></i></nav>
      <div class="spacer"></div>
      <div class="daemon-chip"><i class="dot" id="daemon-dot"></i><div><b id="daemon-title">Connecting…</b><span id="daemon-sub"></span></div></div>
    </aside>
    <main class="main">
      <header class="top">
        <div><h1 id="title"></h1><p id="subtitle"></p></div>
        <div class="tools"><div class="actions" id="actions"></div><button class="btn ghost theme-btn" id="help-btn" title="Help (?)" aria-label="Help"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2.9-1.2 1.8"/><path d="M12 17h.01"/></svg></button><button class="btn ghost theme-btn" id="theme-btn" title="Theme" aria-label="Theme"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg></button></div>
      </header>
      <div class="views" id="views"></div>
    </main>
  </div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div class="offline" id="offline"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
